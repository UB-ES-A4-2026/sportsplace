name: CI

on:
  pull_request:
  push:
    branches: [main,dev]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build

  tools:
    name: Herramientas de migración (lint y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            tools/package-lock.json
            e2e/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix tools ci
      - run: npm --prefix e2e ci
      - run: npm --prefix e2e run lint
      - run: npm --prefix e2e run test:unit
      - name: Instalar Chromium y dependencias del navegador
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Preparar Supabase local aislado, migraciones y semilla (T12-8)
        run: npm --prefix tools run test-env:up
      - name: Probar web y API contra la base de pruebas
        run: npm --prefix e2e test
      - name: Guardar informe y evidencia de fallos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Detener solo el entorno de pruebas
        if: always()
        run: npm --prefix tools run test-env:down
